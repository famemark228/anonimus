<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Сайт с Чатом</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .dark-theme {
            background-color: #333;
            color: white;
        }
        button {
            padding: 10px;
            margin: 5px;
        }
        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Добро пожаловать на мой сайт!</h1>
    <p>Это пример сайта с чатом.</p>

    <h2>Отправить сообщение</h2>
    <input type="text" id="userMessage" placeholder="Введите ваше сообщение" />
    <button id="sendMessage">Отправить</button>

    <h2>Сообщения</h2>
    <div id="messages"></div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const sendMessageButton = document.getElementById('sendMessage');
        const userMessageInput = document.getElementById('userMessage');

        // Функция для загрузки сообщений и фотографий
        const loadMessages = () => {
            const messages = JSON.parse(localStorage.getItem('messages')) || [];
            const photos = JSON.parse(localStorage.getItem('photos')) || [];
            messagesDiv.innerHTML = '';

            messages.forEach((msg, index) => {
                const msgElement = document.createElement('div');
                msgElement.textContent = `Пользователь ${msg.number}: ${msg.text}`;
                messagesDiv.appendChild(msgElement);
            });

            // Отображение загруженных фотографий
            photos.forEach(photo => {
                const imgElement = document.createElement('img');
                imgElement.src = photo;
                imgElement.style.width = '100px';
                imgElement.style.margin = '5px';
                messagesDiv.appendChild(imgElement);
            });
        };

        // Отправка сообщения
        sendMessageButton.addEventListener('click', () => {
            const message = userMessageInput.value;
            if (message) {
                const messages = JSON.parse(localStorage.getItem('messages')) || [];
                messages.push({ number: 'Пользователь', text: message });
                localStorage.setItem('messages', JSON.stringify(messages));
                userMessageInput.value = '';
                loadMessages();
            } else {
                alert('Пожалуйста, введите сообщение.');
            }
        });

        // Загрузка сообщений и фотографий при загрузке страницы
        loadMessages();
    </script>
</body>
</html>
