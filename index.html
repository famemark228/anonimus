<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anonimus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
        }
        .content {
            flex: 1;
        }
        .sidebar {
            width: 200px;
            margin-left: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
        }
        .dark-theme {
            background-color: #333;
            color: white;
        }
        button {
            padding: 10px;
            margin: 5px;
        }
        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
        img {
            width: 100px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>anonim</h1>
        <p>переписывайтесь</p>

        <h2>Создать новый код для себя</h2>
        <input type="text" id="userName" placeholder="Введите ваше имя" />
        <button id="generateCode">Создать код</button>
        <p id="userCode"></p>

        <h2>Отправить сообщение</h2>
        <input type="text" id="userMessage" placeholder="Введите ваше сообщение" />
        <button id="sendMessage">Отправить</button>

        <h2>Сообщения</h2>
        <div id="messages"></div>
    </div>

    <div class="sidebar">
        <h2>Загруженные фотографии</h2>
        <div id="photos"></div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const sendMessageButton = document.getElementById('sendMessage');
        const userMessageInput = document.getElementById('userMessage');
        const generateCodeButton = document.getElementById('generateCode');
        const userCodeDisplay = document.getElementById('userCode');
        const userNameInput = document.getElementById('userName');
        const photosDiv = document.getElementById('photos');

        // Генерация случайного кода
        const generateRandomCode = () => {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        };

        // Функция для загрузки сообщений
        const loadMessages = () => {
            const messages = JSON.parse(localStorage.getItem('messages')) || [];
            messagesDiv.innerHTML = '';

            messages.forEach(msg => {
                const msgElement = document.createElement('div');
                msgElement.textContent = `Пользователь ${msg.number}: ${msg.text}`;
                messagesDiv.appendChild(msgElement);
            });
        };

        // Функция для загрузки фотографий
        const loadPhotos = () => {
            const photos = JSON.parse(localStorage.getItem('photos')) || [];
            photosDiv.innerHTML = '';

            photos.forEach(photo => {
                const imgElement = document.createElement('img');
                imgElement.src = photo;
                photosDiv.appendChild(imgElement);
            });
        };

        // Генерация кода для пользователя
        generateCodeButton.addEventListener('click', () => {
            const userName = userNameInput.value;
            if (userName) {
                const userCode = generateRandomCode();
                userCodeDisplay.textContent = `Ваш код: ${userCode}`;
                
                // Сохранение кода
                const users = JSON.parse(localStorage.getItem('users')) || {};
                users[userName] = userCode;
                localStorage.setItem('users', JSON.stringify(users));
            } else {
                alert('Пожалуйста, введите ваше имя.');
            }
        });

        // Отправка сообщения
        sendMessageButton.addEventListener('click', () => {
            const message = userMessageInput.value;
            if (message) {
                const userName = userNameInput.value || 'Аноним';
                const messages = JSON.parse(localStorage.getItem('messages')) || [];
                messages.push({ number: userName, text: message });
                localStorage.setItem('messages', JSON.stringify(messages));
                userMessageInput.value = '';
                loadMessages();
            } else {
                alert('Пожалуйста, введите сообщение.');
            }
        });

        // Загрузка сообщений и фотографий при загрузке страницы
        loadMessages();
        loadPhotos();
    </script>
</body>
</html>
